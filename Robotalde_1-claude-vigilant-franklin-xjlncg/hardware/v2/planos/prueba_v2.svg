<text x="222.000" y="121.800" font-size="2.400" fill="#000000" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">60 × 6 × 40, aleta completa, 2 imanes Ø4×4 en X = ±15.</text>
<text x="8.000" y="10.000" font-size="5.000" fill="#000000" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-weight="bold">Pieza de prueba v2 (imprimir PRIMERO): imanes, ranura, polaridad y aleta</text>
<text x="8.000" y="16.000" font-size="3.000" fill="#333333" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">1) Diámetros de los imanes a presión. 2) La chapa entra en la ranura y se centra sola dejándola caer desde ±5 mm. 3) Girada 180° se repele.</text>
<text x="8.000" y="20.200" font-size="3.000" fill="#333333" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">4) Con el SO-101: la pinza abierta abraza la aleta con holgura, cerrada la sujeta y la chapa no gira al levantarla. 5) Distancia a la que la chapa salta sola.</text>
