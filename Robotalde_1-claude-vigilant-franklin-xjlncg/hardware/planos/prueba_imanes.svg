<text x="165.000" y="126.000" font-size="2.800" fill="#000000" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">elige la holgura de los topes de la loseta.</text>
<text x="8.000" y="10.000" font-size="5.000" fill="#000000" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-weight="bold">Piezas de prueba: imanes y encaje</text>
<text x="8.000" y="16.000" font-size="3.000" fill="#333333" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Diámetros de agujero a probar (contrato): 10,2, 10,4, 10,6 mm. El imán debe entrar a presión con el pulgar y no caerse boca abajo.</text>
<text x="8.000" y="20.200" font-size="3.000" fill="#333333" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Si todos quedan flojos o duros, anota cuál y ajusta el resto de agujeros con ese valor.</text>
