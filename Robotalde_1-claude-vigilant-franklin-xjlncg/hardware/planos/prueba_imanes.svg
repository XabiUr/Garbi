<text x="25.000" y="117.000" font-size="2.800" fill="#000000" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Placa de 60 × 22 × 6 mm. Agujeros ciegos de 3,2 mm de profundidad (imán de 10×3).</text>
<text x="25.000" y="126.000" font-size="2.800" fill="#000000" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Números grabados 0,4 mm. Imprímela con la cara de los agujeros arriba y la misma configuración que las piezas.</text>
