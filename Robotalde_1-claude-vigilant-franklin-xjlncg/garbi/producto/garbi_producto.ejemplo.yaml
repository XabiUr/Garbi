# Configuración del producto Garbi (garbi/producto/config.py y garbi/producto/vision.py). Plan:
# .plans/aspira/producto.md
#   python -m garbi.producto           # robot real (lee este archivo)
#   python -m garbi.producto --demo    # sin hardware (robot, cámaras y escena falsos)
# Lo marcado «MEDIR» es un valor de ejemplo: medirlo en el sitio. Articulaciones en grados de LeRobot, en el orden
# shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper (pinza 0-100). Posiciones en píxeles de la
# cámara de arriba (640 × 480). Tiempos en segundos.

puertos:
  follower: /dev/ttyACM0        # MEDIR (lerobot-find-port)
  aspiradora: null              # null = sin Arduino: modo manual (se enciende con el pie). Con Arduino: /dev/ttyUSB0

camaras:
  top: 0                        # MEDIR (lerobot-find-cameras opencv)
  wrist: 1                      # MEDIR

id_robot: garbi                 # el id con el que se calibró el seguidor

# Reposo: girado a la derecha, fuera del paso. MEDIR (leer la postura con el robot colocado a mano).
postura_reposo: [-60.0, -100.0, 95.0, 60.0, 0.0, 0.0]
# Despierto: postura de espera entre agujeros. MEDIR.
postura_despierto: [0.0, -60.0, 60.0, 40.0, 0.0, 0.0]

politica: act                   # act (ACT entrenado) | circulo (respaldo: círculo morado + matriz)
act_desde: reposo               # reposo (como en el entrenamiento: vuelve a reposo antes de cada agujero) | despierto

act:
  # Carpeta local del checkpoint (…/checkpoints/last/pretrained_model, o la carpeta de salida del entrenamiento)
  # o repo del Hub (usuario/garbi_act). Las cámaras y el estado se leen de las input_features del modelo.
  modelo: salidas/garbi_act/checkpoints/last/pretrained_model   # MEDIR
  dispositivo: cpu              # cpu | cuda | mps
  camaras: {}                   # vacío = automático. Si el dataset usa otros nombres: {front: top, hand: wrist}
  estado: medido                # medido (postura leída, como lerobot-record) | orden (la acción anterior)
  ensemble: null                # ensemble temporal de ACT (p. ej. 0.01); null = trozos de acciones normales
  umbral_llegada: 0.5           # ha llegado cuando la acción cambia menos de esto (grados)...
  pasos_llegada: 15             # ...durante estos pasos seguidos (0,5 s a 30 Hz)
  tiempo_max: 12.0              # o a los X s, aunque no converja
  tarea: "Approach the drill bit."

circulo:
  postura_intermedia: null      # despliegue por una postura segura (6 grados) antes de ir al destino; null = directo
  velocidad: 60.0               # °/s pico por articulación
  tolerancia: 1.0               # grados para dar por alcanzado el destino
  actualizar_px: 4.0            # si el círculo se mueve más que esto durante el acercamiento, se re-apunta

matriz:
  ruta: matriz.csv              # MEDIR: CSV o JSON (formato en garbi/producto/matriz.py)
  posicion: auto                # auto | uv (px de la cámara de arriba) | xy (mm del tapete)
  tapete_mm: [450.0, 400.0]     # ancho y alto del tapete (solo si la matriz va en mm): el del equipo es 450 × 400
  wrist_roll: 0.0               # si la matriz no trae wrist_roll
  pinza: 0.0                    # si la matriz trae 5 articulaciones (sin pinza)
  extrapolar_max_px: 80.0       # fuera de la rejilla se extrapola como mucho esto (y se avisa)

tiempos:
  quieto_desde_reposo: 1.0      # círculo quieto (con mano + taladro) para acercarse desde REPOSO
  quieto_desde_despierto: 2.0   # ídem desde DESPIERTO
  rango_salida_px: 60.0         # el taladro se aleja más que esto del punto de llegada → DESPIERTO
  perdido: 0.7                  # sin mano + taladro durante esto → se ha ido
  sin_taladro_limpiar: 5.0      # sin taladro en escena (tras ≥1 agujero, con tabla) → LIMPIEZA_TABLA
  sin_tabla: 1.5                # sin ver la tabla (tras haberla visto) → LIMPIEZA_TAPETE
  tolerancia_reposo: 3.0        # grados para considerar que ya está en reposo

barridos:
  paso_px: 30.0                 # separación entre pasadas del zigzag
  margen_px: 10.0               # margen hacia dentro desde el borde
  # Se suma a la postura de la matriz (que es la de la broca apoyada) para barrer a altura fija. MEDIR (signo y valor)
  offset_tabla: [0.0, -8.0, 4.0, 0.0, 0.0, 0.0]
  offset_tapete: [0.0, -6.0, 3.0, 0.0, 0.0, 0.0]
  velocidad: 40.0               # °/s por articulación
  aceleracion: 120.0            # °/s²

velocidad_max: 90.0             # °/s por articulación en todas las órdenes (o una lista de 6)
movimiento_fijo: 60.0           # °/s pico de los movimientos fijos (a reposo, a despierto)
wrist_roll_fijo: null           # null = como en el dataset/matriz; un número = se fuerza siempre
pinza_fija: null                # ídem para la pinza
hz: 30.0

# Visión del producto (garbi/producto/vision.py): solo lo que cambie respecto a POR_DEFECTO de ese módulo.
# Secciones: circulo (detector, morado HSV, área, circularidad, tol_quieto_px...), manos, agarre, tabla.
vision: {}

# Esquinas del tapete en la cámara de arriba (px): las usan la visión y el barrido del tapete.
# MEDIR con python -m garbi.producto.vision --marcar-tapete --camara 0 (reescribe esta línea)
tapete_px: [[80, 60], [560, 60], [560, 420], [80, 420]]
